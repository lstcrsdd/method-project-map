[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "method-project-map"
version = "0.2.0"
description = "Method Project Map — a static, LLM-free map of codebases (Python, TypeScript/JavaScript, Go, Java, Kotlin, C#) for people and AI coding agents"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "lstcrsdd" }]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
# TypeScript / JavaScript, Go, Java, Kotlin, C# (Python needs nothing)
langs = ["tree-sitter>=0.22", "tree-sitter-javascript", "tree-sitter-typescript", "tree-sitter-go", "tree-sitter-java",
         "tree-sitter-kotlin", "tree-sitter-c-sharp"]
keywords = ["architecture", "code map", "static analysis", "ai agents", "mcp", "reflexion model"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://method-network.com/"
Repository = "https://github.com/lstcrsdd/method-project-map"
Issues = "https://github.com/lstcrsdd/method-project-map/issues"

[project.scripts]
pmap = "pmap.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["pmap*"]

[tool.setuptools.package-data]
pmap = ["web/static/*.html", "agent/*.md"]
